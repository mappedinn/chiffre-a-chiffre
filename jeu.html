<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiffre à chiffre</title>
<meta name="description" content="Missions de calcul posé : multiplication, division et priorité des opérations, un chiffre à la fois, avec un exemple avant chaque mission.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  /* Idée de mise en page : un cahier quadrillé. La feuille de travail est la vedette, le reste est en marge. */
  --paper: #EEF4F9;
  --paper-line: #DCE8F2;
  --sheet: #FFFFFF;
  --grid: #C6DAEA;
  --ink: #12203A;
  --ink-2: #4B5C78;
  --pen: #1D4ED8;
  --hl: #FFD23F;
  --hl-soft: #FFF2B8;
  --ok: #12803C;
  --ok-soft: #DDF4E5;
  --bad: #D4372C;
  --bad-soft: #FDE3E0;
  --m-mult: #E0522A;
  --m-div: #0D8F7D;
  --m-ops: #6B46C8;
  --accent: var(--m-mult);
  --radius: 14px;
  --font-d: 'Bricolage Grotesque', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-n: 'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--paper-line) 1px, transparent 1px), linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font: 400 17px/1.5 var(--font-b);
  -webkit-text-size-adjust: 100%;
  overflow-x: clip;
}
h1, h2, h3 { font-family: var(--font-d); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- En-tête ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 8px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.brand-mark { width: 38px; height: 38px; flex: none; }
.brand-name { font: 800 22px/1 var(--font-d); letter-spacing: -0.02em; }
.brand-name span { background: linear-gradient(transparent 62%, var(--hl) 62%, var(--hl) 92%, transparent 92%); padding: 0 2px; }
.agent-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--grid); border-radius: 999px; padding: 5px 12px; }
.agent-chip b { color: var(--ink); font-weight: 700; }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 12px; border: 2px solid var(--ink); background: var(--sheet); font-weight: 700; box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--ink); }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2); padding: 8px 12px; min-height: 40px; }
.btn-ghost:hover { background: rgba(255,255,255,.7); box-shadow: none; transform: none; }
.btn-small { min-height: 40px; padding: 6px 14px; font-size: 15px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- Accueil ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 32px; align-items: center; padding: 28px 0 20px; }
.hero h1 { font-size: clamp(34px, 5.4vw, 58px); font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 90%, transparent 90%); }
.hero p.lead { margin-top: 14px; font-size: 19px; color: var(--ink-2); max-width: 46ch; }
.name-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.name-row label { font-weight: 700; }
.name-row input { font: inherit; min-height: 46px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--sheet); width: min(260px, 100%); }
.hero-sheet { background: var(--sheet); border-radius: var(--radius); padding: 18px 14px 10px; box-shadow: 0 2px 0 var(--grid), 0 18px 36px -22px rgba(18, 32, 58, .45); transform: rotate(1.2deg); }
.hero-sheet .grid { margin: 0 auto; }
.hero-cap { text-align: center; color: var(--ink-2); font-size: 14px; padding: 8px 0 4px; }

.missions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 10px 0 26px; }
.mcard { --accent: var(--m-mult); background: var(--sheet); border: 2px solid var(--ink); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 5px 0 var(--ink); }
.mcard[data-m="div"] { --accent: var(--m-div); }
.mcard[data-m="ops"] { --accent: var(--m-ops); }
.mcard-top { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; font: 700 14px/1 var(--font-b); letter-spacing: .08em; text-transform: uppercase; }
.mcard-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.mcard h2 { font-size: 28px; font-weight: 800; }
.mcard .sub { font-weight: 700; color: var(--accent); }
.mcard .pitch { color: var(--ink-2); font-size: 16px; }
.levels { display: grid; gap: 8px; margin-top: auto; padding-top: 10px; }
.lvl { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; background: #F4F8FC; border: 2px solid var(--grid); border-radius: 10px; padding: 8px 12px; min-height: 48px; }
.lvl:hover { border-color: var(--accent); background: #fff; }
.lvl-n { font: 800 18px/1 var(--font-d); color: var(--accent); width: 20px; }
.lvl-t { flex: 1; line-height: 1.2; }
.lvl-t b { display: block; font-size: 16px; }
.lvl-t small { color: var(--ink-2); font-size: 14px; }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 18px; height: 18px; }
.star-on { fill: var(--hl); stroke: var(--ink); stroke-width: 1.5; }
.star-off { fill: none; stroke: var(--grid); stroke-width: 1.5; }
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 36px; color: var(--ink-2); font-size: 14px; }

/* ---------- Préparation ---------- */
.crumbs { padding: 4px 0 6px; }
.panel { background: var(--sheet); border: 2px solid var(--ink); border-radius: var(--radius); padding: 22px; box-shadow: 0 5px 0 var(--ink); max-width: 820px; }
.tag { display: inline-block; background: var(--accent); color: #fff; font: 700 13px/1 var(--font-b); letter-spacing: .08em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; }
.panel h1 { font-size: clamp(30px, 4.6vw, 44px); margin: 10px 0 6px; font-weight: 800; }
.panel .lead { color: var(--ink-2); max-width: 56ch; }
.field { margin-top: 22px; }
.field h3 { font: 700 15px/1.2 var(--font-b); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin-bottom: 10px; }
.seg { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.seg-btn { text-align: left; background: #F4F8FC; border: 2px solid var(--grid); border-radius: 12px; padding: 10px 14px; min-height: 64px; }
.seg-btn b { display: block; }
.seg-btn small { color: var(--ink-2); font-size: 14px; line-height: 1.3; display: block; }
.seg-btn[aria-pressed="true"] { border-color: var(--ink); background: var(--hl-soft); box-shadow: 0 3px 0 var(--ink); }
.seg.counts { grid-template-columns: repeat(3, minmax(0, 120px)); }
.seg.counts .seg-btn { min-height: 52px; text-align: center; font-weight: 700; }
.go { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.locked-note { margin-top: 12px; display: inline-flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; color: var(--ink-2); background: #F4F8FC; border: 1px dashed var(--grid); border-radius: 10px; padding: 8px 12px; }

/* ---------- Zone de travail ---------- */
.stage { --accent: var(--m-mult); }
.stage[data-m="div"] { --accent: var(--m-div); }
.stage[data-m="ops"] { --accent: var(--m-ops); }
.stage-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 4px 0 12px; }
.stage-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.stage-title h1 { font-size: clamp(22px, 3.4vw, 32px); font-weight: 800; }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: var(--sheet); }
.dot.now { background: var(--hl); }
.dot.s1 { background: #FFE9A0; border-color: var(--ink); }
.dot.s2 { background: #FFD23F; }
.dot.s3 { background: var(--ok); }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; padding-bottom: 36px; }
.sheet { background: var(--sheet); border-radius: var(--radius); box-shadow: 0 2px 0 var(--grid), 0 18px 36px -24px rgba(18, 32, 58, .5); padding: 20px 16px; overflow-x: auto; position: relative; min-height: 220px; }
.sheet-stmt { text-align: center; font: 800 26px/1.1 var(--font-d); margin-bottom: 14px; }
.sheet-stmt small { display: block; font: 400 15px/1.3 var(--font-b); color: var(--ink-2); margin-bottom: 4px; letter-spacing: 0; }
.side { display: grid; gap: 14px; position: sticky; top: 12px; }

/* ---------- Grille ---------- */
.grid { position: relative; display: grid; width: max-content; margin: 0 auto; border-top: 1px solid var(--grid); border-left: 1px solid var(--grid); }
.cell { display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); font: 600 calc(var(--cs) * .6)/1 var(--font-n); color: var(--ink); user-select: none; -webkit-user-select: none; position: relative; background: #fff; transition: background .15s; }
.cell.in { color: var(--pen); }
.cell.cr { font-size: calc(var(--cs) * .38); background: #FBFCFE; color: var(--accent); font-weight: 700; }
.cell.lbl { font: 400 calc(var(--cs) * .27)/1 var(--font-b); color: var(--ink-2); }
.cell.lb { border-bottom: 3px solid var(--ink); }
.cell.bl { border-left: 3px solid var(--ink); }
.cell.cur { background: var(--hl-soft); box-shadow: inset 0 0 0 3px var(--hl); animation: pulse 1.15s ease-in-out infinite; z-index: 1; }
.cell.sel { background: var(--hl-soft); box-shadow: inset 0 0 0 3px var(--hl); z-index: 1; }
.cell.new { background: var(--hl-soft); }
.cell.pop { animation: pop .28s ease-out; }
.cell.bad { background: var(--bad-soft); color: var(--bad); animation: shake .32s; }
.cell.click { cursor: pointer; background: #F3F8FD; }
.cell.click:hover { background: #E7F1FB; }
.cell.empty.cr.click::after { content: ""; }
@keyframes pulse { 0%, 100% { box-shadow: inset 0 0 0 3px var(--hl); } 50% { box-shadow: inset 0 0 0 5px var(--hl); } }
@keyframes pop { 0% { transform: scale(.55); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* ---------- Expressions (priorité des opérations) ---------- */
.exprs { display: grid; gap: 10px; justify-items: center; }
.ex-line { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; font: 700 clamp(24px, 4.6vw, 36px)/1.2 var(--font-n); min-height: 52px; }
.ex-line.past { color: var(--ink-2); font-size: clamp(20px, 3.8vw, 28px); }
.ex-line .eq { color: var(--ink-2); margin-right: 4px; }
.tk { padding: 2px 8px; border-radius: 8px; }
.tk.p { color: var(--ink-2); padding: 0 2px; }
.tk.used { background: var(--hl-soft); box-shadow: inset 0 -3px 0 var(--hl); }
.tk.pend { background: var(--hl-soft); box-shadow: inset 0 0 0 2px var(--hl); }
.opb { font: inherit; border: 2px dashed var(--accent); background: #fff; color: var(--accent); border-radius: 10px; padding: 0 10px; min-width: 46px; min-height: 46px; cursor: pointer; }
.opb:hover { background: var(--hl-soft); border-style: solid; }
.opb.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); animation: shake .32s; }
.ans-line { display: flex; align-items: center; gap: 8px; font: 700 clamp(22px, 4vw, 32px)/1.2 var(--font-n); margin-top: 6px; }
.ans-box { min-width: 76px; min-height: 52px; padding: 2px 12px; text-align: center; border-radius: 10px; border: 3px solid var(--hl); background: var(--hl-soft); color: var(--pen); }
.ans-box.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .32s; }
.final-box { margin-top: 8px; font: 800 26px/1.2 var(--font-d); color: var(--ok); display: flex; align-items: center; gap: 10px; }
.legend { background: #F4F8FC; border: 1px dashed var(--grid); border-radius: 12px; padding: 10px 14px; margin-top: 18px; font-size: 15px; }
.legend b { display: block; margin-bottom: 4px; }
.legend ol { margin: 0; padding-left: 20px; }
.legend li::marker { font-weight: 700; color: var(--m-ops); }

/* ---------- Coach, pavé ---------- */
.coach { background: var(--sheet); border: 2px solid var(--ink); border-left: 8px solid var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.coach-tag { font: 700 12px/1 var(--font-b); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.fb { font-size: 16px; padding: 8px 10px; border-radius: 8px; }
.fb.ok { background: var(--ok-soft); color: #0B5A29; }
.fb.no { background: var(--bad-soft); color: #8E1F17; }
.ask { font-weight: 700; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { min-height: 58px; border-radius: 12px; border: 2px solid var(--ink); background: var(--sheet); font: 700 26px/1 var(--font-n); box-shadow: 0 3px 0 var(--ink); }
.key:active { transform: translateY(3px); box-shadow: none; }
.key.fn { font: 700 16px/1.1 var(--font-b); background: #F4F8FC; }
.key.key-go { font: 700 16px/1.1 var(--font-b); background: var(--accent); color: #fff; }
.key[disabled] { opacity: .35; pointer-events: none; }
.result-card { background: var(--sheet); border: 2px solid var(--ok); border-radius: 12px; padding: 14px; display: grid; gap: 10px; justify-items: start; }
.result-card .big { font: 800 22px/1.2 var(--font-d); color: var(--ok); }
.result-card .stars svg { width: 30px; height: 30px; }

/* ---------- Exemple animé ---------- */
.demo-ctl { display: grid; gap: 8px; }
.demo-ctl .row { display: flex; flex-wrap: wrap; gap: 8px; }
.demo-ctl .btn { flex: 1 1 auto; }
.demo-ctl .btn-primary { flex-basis: 100%; }
.progress-bar { height: 8px; background: var(--paper-line); border-radius: 999px; overflow: hidden; }
.progress-bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.steps-count { font-size: 14px; color: var(--ink-2); }

/* ---------- Bilan ---------- */
.done { display: grid; justify-items: center; text-align: center; gap: 14px; padding: 18px 0 40px; }
.stamp { font: 800 clamp(28px, 6vw, 48px)/1 var(--font-d); text-transform: uppercase; letter-spacing: .02em; color: var(--ok); border: 6px solid var(--ok); border-radius: 14px; padding: 12px 20px; transform: rotate(-5deg); animation: stampIn .5s cubic-bezier(.2, 1.4, .4, 1) both; background: rgba(255, 255, 255, .6); }
.stamp.mid { color: var(--m-ops); border-color: var(--m-ops); }
.stamp.low { color: var(--ink-2); border-color: var(--ink-2); }
@keyframes stampIn { 0% { opacity: 0; transform: rotate(-14deg) scale(2.4); } 100% { opacity: 1; transform: rotate(-5deg) scale(1); } }
.recap { background: var(--sheet); border: 2px solid var(--ink); border-radius: var(--radius); padding: 8px 16px; width: min(560px, 100%); text-align: left; }
.recap-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--grid); font-family: var(--font-n); font-size: 17px; }
.recap-row:last-child { border-bottom: 0; }
.total { font: 800 26px/1 var(--font-d); }
.done .go { justify-content: center; }

/* ---------- Fenêtre enseignant ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(18, 32, 58, .55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--sheet); border: 2px solid var(--ink); border-radius: var(--radius); padding: 22px; width: min(560px, 100%); max-height: 92vh; overflow: auto; box-shadow: 0 8px 0 var(--ink); display: grid; gap: 14px; }
.modal h2 { font-size: 26px; font-weight: 800; }
.modal label { display: grid; gap: 4px; font-weight: 700; font-size: 15px; }
.modal select, .modal input { font: 400 17px var(--font-b); min-height: 46px; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; width: 100%; }
.modal .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.linkbox { display: grid; gap: 8px; }
.linkbox input { font-family: var(--font-n); font-size: 14px; }
.note { font-size: 14px; color: var(--ink-2); }

/* ---------- Adaptation ---------- */
@media (max-width: 880px) {
  .hero { grid-template-columns: 1fr; }
  .hero-sheet { transform: none; max-width: 420px; }
  .missions { grid-template-columns: 1fr; }
  .work { grid-template-columns: 1fr; }
  .side { display: contents; }
  .work { gap: 12px; }
  .pad-wrap { position: sticky; bottom: 0; z-index: 5; background: linear-gradient(transparent, var(--paper) 14px); padding: 14px 0 10px; }
  .pad { gap: 6px; }
  .key { min-height: 48px; font-size: 24px; }
  .work { padding-bottom: 12px; }
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  .agent-chip { display: none; }
  .modal .two { grid-template-columns: 1fr; }
  .key { min-height: 44px; font-size: 22px; box-shadow: 0 2px 0 var(--ink); }
  .coach { padding: 8px 10px; gap: 6px; }
  .fb { font-size: 14px; padding: 5px 8px; }
  .ask { font-size: 15px; line-height: 1.35; }
  .sheet { padding: 14px 8px; }
  .sheet-stmt { font-size: 22px; margin-bottom: 8px; }
  .stage-title h1 { font-size: 20px; }
  .stage-head { padding-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* flèche « on abaisse » */
.dn { position: absolute; width: 0; border-left: 3px solid var(--accent); opacity: .5; z-index: 3; pointer-events: none; transform-origin: top; }
.dn::after { content: ""; position: absolute; left: -8.5px; bottom: -3px; border: 7px solid transparent; border-top: 10px solid var(--accent); border-bottom: 0; }
.dn.now { opacity: 1; animation: grow .55s ease-out both; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

/* saisie au clavier dans la case */
.cellin { width: 100%; height: 100%; border: 0; padding: 0; margin: 0; background: transparent; text-align: center; font: inherit; color: var(--pen); caret-color: transparent; outline: none; }
.ans-box.ansin { font: inherit; width: 96px; caret-color: var(--pen); outline: none; }
.typehint { font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
.actrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.pad + .actrow { margin-top: 10px; }

</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Ce site a besoin de JavaScript pour fonctionner.</p></noscript>
<script>
/* ===== Moteur : génération de problèmes, grilles et étapes ===== */
(function (root) {
  'use strict';

  const POS = ['unités', 'dizaines', 'centaines', 'milliers', 'dizaines de mille', 'centaines de mille'];
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const digitsOf = (n) => String(n).split('').map(Number);
  const plural = (n, s, p) => (n > 1 ? p : s);

  function newLayout() {
    return { cells: {}, rowKinds: [], lines: [], steps: [], groups: [], cols: 0 };
  }
  function put(L, r, c, o) {
    if (c < 0) throw new Error('colonne négative ' + r + ',' + c);
    L.cells[r + ',' + c] = Object.assign({ r: r, c: c }, o);
  }
  // Ajoute un groupe d'étapes (une opération "mentale" qui écrit 1 à 3 chiffres)
  function addGroup(L, text, stepDefs, intro) {
    const gid = L.groups.length;
    L.groups.push({ text: text, steps: [], intro: intro || '' });
    stepDefs.forEach((s) => {
      const idx = L.steps.length;
      L.steps.push({ r: s.r, c: s.c, expected: s.exp, ask: s.ask, hint: s.hint, gid: gid });
      L.groups[gid].steps.push(idx);
      put(L, s.r, s.c, { kind: s.kind || 'input', expected: s.exp, cls: s.cls || '' });
    });
  }

  /* ---------------- MULTIPLICATION ---------------- */
  function buildMult(a, b) {
    const L = newLayout();
    const A = digitsOf(a), B = digitsOf(b), n = A.length, m = B.length;
    const prod = a * b, Ln = String(prod).length, W = n + m;
    L.cols = W + 1;

    // plan de chaque ligne de produit partiel
    const plan = [];
    const ppMap = []; // ppMap[k][col] = chiffre attendu
    for (let k = 0; k < m; k++) {
      const bk = B[m - 1 - k];
      const groups = [];
      ppMap[k] = {};
      const intro = k === 0
        ? 'On multiplie d’abord par les unités du multiplicateur (' + bk + '), de droite à gauche.'
        : 'Nouvelle ligne : on multiplie par les ' + POS[k] + ' (' + bk + ').';
      let first = true;
      const withIntro = (t) => { if (first) { first = false; return intro + ' ' + t; } return t; };
      if (k > 0) {
        const zs = [];
        for (let j = 0; j < k; j++) {
          zs.push({
            kind: 'pp', col: W - j, exp: 0,
            ask: j === 0 ? withIntro('On décale d’un rang pour chaque position : écris ' + (k === 1 ? 'un 0' : k + ' zéros') + ', en commençant à droite.') : 'Encore un 0 pour décaler.',
            hint: 'Multiplier par ' + bk + '0'.repeat(k) + ' revient à décaler : on écrit d’abord ' + (k === 1 ? 'un 0' : k + ' zéros') + '.'
          });
          ppMap[k][W - j] = 0;
        }
        groups.push({ text: 'On multiplie par les ' + POS[k] + ' : on écrit ' + (k === 1 ? 'un 0' : k + ' zéros') + ' pour décaler la ligne.', steps: zs });
      }
      let carry = 0;
      for (let i = 0; i < n; i++) {
        const ai = A[n - 1 - i];
        const p = ai * bk + carry;
        const dg = p % 10, nc = Math.floor(p / 10);
        const op = bk + ' × ' + ai + (carry ? ' + ' + carry : '');
        const last = i === n - 1;
        const col = W - k - i;
        const st = [];
        const calc = 'Calcule ' + op + (carry ? ' (n’oublie pas la retenue)' : '') + '. ';
        if (last && nc > 0) {
          st.push({ kind: 'pp', col: col, exp: dg, ask: withIntro(calc + 'Écris le chiffre des unités du résultat.'), hint: op + ' = ' + p });
          st.push({ kind: 'pp', col: col - 1, exp: nc, ask: 'Écris maintenant le chiffre des dizaines, juste à gauche.', hint: op + ' = ' + p });
          ppMap[k][col] = dg; ppMap[k][col - 1] = nc;
          groups.push({ text: op + ' = ' + p + '. C’est le dernier chiffre : on écrit tout le résultat, ' + p + '.', steps: st });
        } else {
          st.push({ kind: 'pp', col: col, exp: dg, ask: withIntro(calc + (p >= 10 ? 'Écris le chiffre des unités du résultat.' : 'Écris le résultat.')), hint: op + ' = ' + p });
          ppMap[k][col] = dg;
          if (!last && nc > 0) {
            st.push({ kind: 'carry', col: col - 1, exp: nc, ask: 'Écris la retenue (le chiffre des dizaines du résultat) au-dessus de la colonne suivante.', hint: op + ' = ' + p + ' : la retenue est ' + nc + '.' });
            groups.push({ text: op + ' = ' + p + '. On écrit ' + dg + ' et on retient ' + nc + '.', steps: st });
          } else {
            groups.push({ text: op + ' = ' + p + '. On écrit ' + dg + '.', steps: st });
          }
        }
        carry = nc;
      }
      if (groups.length) groups[0].intro = intro;
      const hasCarry = groups.some((g) => g.steps.some((s) => s.kind === 'carry'));
      plan.push({ groups: groups, hasCarry: hasCarry });
    }

    // lignes 0 et 1 : multiplicande et multiplicateur
    L.rowKinds.push('norm');
    A.forEach((d, i) => put(L, 0, W - (n - 1 - i), { kind: 'static', text: d }));
    L.rowKinds.push('norm');
    put(L, 1, 0, { kind: 'static', text: '×' });
    B.forEach((d, i) => put(L, 1, W - (m - 1 - i), { kind: 'static', text: d }));
    L.lines.push({ r: 1, c1: 0, c2: W });

    let lastPP = 1;
    for (let k = 0; k < m; k++) {
      let carryRow = -1;
      if (plan[k].hasCarry) { carryRow = L.rowKinds.length; L.rowKinds.push('carry'); }
      const ppRow = L.rowKinds.length; L.rowKinds.push('norm');
      lastPP = ppRow;
      plan[k].groups.forEach((g) => {
        addGroup(L, g.text, g.steps.map((s) => ({
          r: s.kind === 'carry' ? carryRow : ppRow, c: s.col, exp: s.exp, ask: s.ask, hint: s.hint,
          kind: 'input', cls: s.kind === 'carry' ? 'carry' : ''
        })), g.intro);
      });
    }

    if (m > 1) {
      L.lines.push({ r: lastPP, c1: 0, c2: W });
      const resRow = L.rowKinds.length; L.rowKinds.push('norm');
      let carryAdd = 0;
      for (let j = 0; j < Ln; j++) {
        const col = W - j;
        const parts = [];
        for (let k = 0; k < m; k++) if (ppMap[k][col] !== undefined) parts.push(ppMap[k][col]);
        const total = parts.reduce((x, y) => x + y, 0) + carryAdd;
        const dg = total % 10, nc = Math.floor(total / 10);
        const expr = parts.join(' + ') + (carryAdd ? ' + ' + carryAdd + ' (retenue)' : '');
        let ask, text;
        if (parts.length === 1 && !carryAdd) {
          ask = 'Un seul chiffre dans la colonne des ' + POS[j] + ' : recopie-le.';
          text = 'On descend ' + total + '.';
        } else {
          ask = 'Additionne la colonne des ' + POS[j] + ' : ' + expr + '. ' + (total >= 10 && j < Ln - 1 ? 'Écris le chiffre des unités et retiens le reste.' : 'Écris le résultat.');
          text = expr + ' = ' + total + '. ' + (nc > 0 && j < Ln - 1 ? 'On écrit ' + dg + ' et on retient ' + nc + '.' : 'On écrit ' + total + '.');
        }
        if (j === Ln - 1) { if (nc !== 0) throw new Error('somme finale invalide'); }
        addGroup(L, text, [{ r: resRow, c: col, exp: dg, ask: (j === 0 ? 'Il reste à additionner les lignes, colonne par colonne, de droite à gauche. ' : '') + ask, hint: expr + ' = ' + total, kind: 'input', cls: 'result' }], j === 0 ? 'Il reste \u00e0 additionner les lignes, colonne par colonne, de droite \u00e0 gauche.' : '');
        carryAdd = nc;
      }
    } else {
      // pour m = 1, la ligne de produit est le résultat
      Object.keys(L.cells).forEach((k) => { const c = L.cells[k]; if (c.r === lastPP && c.kind === 'input') c.cls = 'result'; });
    }

    L.rows = L.rowKinds.length;
    L.statement = a + ' × ' + b;
    L.answerText = String(prod);
    L.meta = { type: 'mult', a: a, b: b, answer: prod };
    return L;
  }

  function genMult(level) {
    const cfg = { 1: [2, 1], 2: [3, 1], 3: [2, 2], 4: [3, 2] }[level];
    const n = cfg[0], m = cfg[1];
    let a = '';
    for (let i = 0; i < n; i++) a += i === 0 ? rnd(2, 9) : (level === 4 && i < n - 1 && Math.random() < 0.2 ? 0 : rnd(1, 9));
    let b = '';
    for (let i = 0; i < m; i++) b += rnd(2, 9);
    return buildMult(parseInt(a, 10), parseInt(b, 10));
  }

  /* ---------------- DIVISION ---------------- */
  function buildDiv(D, v) {
    const L = newLayout();
    const Dd = digitsOf(D), nd = Dd.length, V = digitsOf(v), nv = V.length;
    let t = nv;
    if (parseInt(Dd.slice(0, t).join(''), 10) < v) t++;
    if (t > nd) throw new Error('dividende trop petit');
    const sim = [];
    let partial = parseInt(Dd.slice(0, t).join(''), 10), pIdx = t - 1, partialLen = t, nextIdx = t;
    for (;;) {
      const q = Math.floor(partial / v);
      if (q < 1 || q > 9) throw new Error('chiffre du quotient invalide');
      const prod = q * v, rem = partial - prod;
      const s = { partial: partial, partialLen: partialLen, q: q, prod: prod, rem: rem, pIdx: pIdx };
      sim.push(s);
      if (nextIdx >= nd) break;
      s.next = Dd[nextIdx];
      partial = rem * 10 + s.next;
      s.nextPartial = partial;
      partialLen = String(rem).length + 1;
      pIdx = nextIdx;
      nextIdx++;
    }
    const nq = sim.length;
    const quotient = parseInt(sim.map((s) => s.q).join(''), 10);
    const remainder = sim[nq - 1].rem;
    if (quotient !== Math.floor(D / v) || remainder !== D % v) throw new Error('division incohérente');

    // Disposition ontarienne : diviseur à gauche, dividende sous la potence, quotient au-dessus du dividende.
    const dStart = nv + 1;
    L.cols = dStart + nd;
    L.rows = 2 + 2 * nq;
    for (let i = 0; i < L.rows; i++) L.rowKinds.push('norm');
    L.bar = { col: dStart, fromRow: 1 };
    L.downs = [];
    L.lines.push({ r: 0, c1: dStart, c2: dStart + nd - 1 });
    V.forEach((d, i) => put(L, 1, i, { kind: 'static', text: d }));
    Dd.forEach((d, i) => put(L, 1, dStart + i, { kind: 'static', text: d }));

    sim.forEach((s, j) => {
      const pCol = dStart + s.pIdx;
      const prodS = String(s.prod), remS = String(s.rem);
      const prodRow = 2 * j + 2, remRow = 2 * j + 3;
      put(L, prodRow, pCol - s.partialLen, { kind: 'static', text: '−' });
      L.lines.push({ r: prodRow, c1: pCol - s.partialLen, c2: pCol });

      addGroup(L, 'Dans ' + s.partial + ', ' + v + ' entre ' + s.q + (s.q > 1 ? ' fois' : ' fois') + ' (' + s.q + ' × ' + v + ' = ' + s.prod + ', sans dépasser ' + s.partial + ').', [{
        r: 0, c: pCol, exp: s.q, kind: 'input', cls: 'quot',
        ask: 'Combien de fois ' + v + ' entre-t-il dans ' + s.partial + ' ? Écris ce chiffre au-dessus du dernier chiffre de ' + s.partial + '.',
        hint: s.q + ' × ' + v + ' = ' + s.prod + ' ne dépasse pas ' + s.partial + '.'
      }]);

      const pd = prodS.split('').map(Number);
      const prodSteps = [];
      for (let i = pd.length - 1, first = true; i >= 0; i--, first = false) {
        prodSteps.push({
          r: prodRow, c: pCol - (pd.length - 1 - i), exp: pd[i], kind: 'input',
          ask: first ? 'Multiplie ' + s.q + ' × ' + v + ', puis écris le résultat sous ' + s.partial + ', en commençant par la droite.' : 'Continue ton résultat vers la gauche.',
          hint: s.q + ' × ' + v + ' = ' + s.prod
        });
      }
      addGroup(L, s.q + ' × ' + v + ' = ' + s.prod + '. On l’écrit sous ' + s.partial + '.', prodSteps);

      const rd = remS.split('').map(Number);
      const remSteps = [];
      for (let i = rd.length - 1, first = true; i >= 0; i--, first = false) {
        remSteps.push({
          r: remRow, c: pCol - (rd.length - 1 - i), exp: rd[i], kind: 'input', cls: j === nq - 1 ? 'result' : '',
          ask: first ? 'Soustrais ' + s.partial + ' − ' + s.prod + '. Écris la différence en commençant par la droite.' : 'Continue vers la gauche.',
          hint: s.partial + ' − ' + s.prod + ' = ' + s.rem
        });
      }
      addGroup(L, s.partial + ' − ' + s.prod + ' = ' + s.rem + '. Le reste (' + s.rem + ') est plus petit que ' + v + ' : c’est bon.', remSteps);

      if (j < nq - 1) {
        L.downs.push({ c: pCol + 1, toR: remRow, key: remRow + ',' + (pCol + 1) });
        addGroup(L, 'On abaisse le ' + s.next + ' : on obtient ' + s.nextPartial + '.', [{
          r: remRow, c: pCol + 1, exp: s.next, kind: 'input',
          ask: 'Abaisse le chiffre suivant du dividende (suis la flèche) : écris-le à droite du reste.',
          hint: 'Le chiffre à abaisser est ' + s.next + '.'
        }]);
      }
    });

    L.statement = D + ' ÷ ' + v;
    L.answerText = quotient + (remainder ? ' reste ' + remainder : '');
    L.meta = { type: 'div', D: D, v: v, quotient: quotient, remainder: remainder };
    return L;
  }

  function noZeroDigits(n) { return String(n).indexOf('0') === -1; }
  function genNoZero(lo, hi) { for (let i = 0; i < 500; i++) { const x = rnd(lo, hi); if (noZeroDigits(x)) return x; } return lo; }

  function genDiv(level) {
    for (let tries = 0; tries < 200; tries++) {
      let v, q, r = 0;
      if (level === 1) { v = rnd(2, 4); q = genNoZero(11, 99); if (q * v >= 100) continue; }
      else if (level === 2) { v = rnd(2, 9); q = genNoZero(11, 99); if (q * v < 100) continue; }
      else if (level === 3) { v = rnd(3, 9); q = genNoZero(111, 999); r = rnd(1, v - 1); }
      else { do { v = rnd(12, 49); } while (v % 10 === 0); q = genNoZero(11, 99); r = Math.random() < 0.5 ? 0 : rnd(1, v - 1); }
      try { return buildDiv(q * v + r, v); } catch (e) { /* on retente */ }
    }
    return buildDiv(384, 8);
  }

  /* ---------------- PRIORITÉ DES OPÉRATIONS ---------------- */
  const MD = { '×': 1, '÷': 1 };

  function parseExpr(s) {
    return s.split(/\s+/).filter(Boolean).map((x) => (x === '(' || x === ')') ? { t: x } : /^\d+$/.test(x) ? { t: 'n', v: +x } : { t: 'o', v: x });
  }
  function exprToString(tokens) { return tokens.map((t) => t.t === 'n' || t.t === 'o' ? t.v : t.t).join(' '); }

  function groupsOf(tokens) {
    const st = [], out = [];
    tokens.forEach((tk, i) => {
      if (tk.t === '(') { st.push({ start: i, child: false }); if (st.length > 1) st[st.length - 2].child = true; }
      else if (tk.t === ')') { const g = st.pop(); out.push({ start: g.start, end: i, inner: !g.child }); }
    });
    return out;
  }
  function pickInSlice(tokens, s, e) {
    const ops = [];
    for (let i = s; i <= e; i++) if (tokens[i].t === 'o') ops.push(i);
    const md = ops.filter((i) => MD[tokens[i].v]);
    return md.length ? md[0] : ops[0];
  }
  function validOps(tokens) {
    const set = new Set();
    const gs = groupsOf(tokens).filter((g) => g.inner);
    if (gs.length) gs.forEach((g) => { const i = pickInSlice(tokens, g.start + 1, g.end - 1); if (i !== undefined) set.add(i); });
    else { const i = pickInSlice(tokens, 0, tokens.length - 1); if (i !== undefined) set.add(i); }
    return set;
  }
  function cleanParens(tokens) {
    let changed = true;
    let out = tokens.slice();
    let removed = false;
    while (changed) {
      changed = false;
      for (let i = 0; i + 2 < out.length; i++) {
        if (out[i].t === '(' && out[i + 1].t === 'n' && out[i + 2].t === ')') { out.splice(i + 2, 1); out.splice(i, 1); changed = true; removed = true; break; }
      }
    }
    return { tokens: out, removed: removed };
  }
  function compute(op, a, b) {
    if (op === '+') return a + b;
    if (op === '−') return a - b;
    if (op === '×') return a * b;
    return a / b;
  }
  function opOk(op, a, b) {
    if (op === '−') return a >= b;
    if (op === '÷') return b !== 0 && a % b === 0;
    return true;
  }
  function reasonKind(tokens, idx) {
    const inParen = groupsOf(tokens).some((g) => idx > g.start && idx < g.end);
    return { inParen: inParen, md: !!MD[tokens[idx].v] };
  }
  function applyOp(tokens, idx) {
    const a = tokens[idx - 1].v, b = tokens[idx + 1].v, op = tokens[idx].v;
    const res = compute(op, a, b);
    const why = reasonKind(tokens, idx);
    const nt = tokens.slice(0, idx - 1).concat([{ t: 'n', v: res }], tokens.slice(idx + 2));
    const c = cleanParens(nt);
    return { tokens: c.tokens, a: a, b: b, op: op, res: res, why: why, parenRemoved: c.removed };
  }
  function opSentence(r) {
    const eq = r.a + ' ' + r.op + ' ' + r.b + ' = ' + r.res + '.';
    let s;
    if (r.why.inParen && r.why.md) s = 'Dans les parenthèses, on fait d’abord les × et ÷ : ' + eq;
    else if (r.why.inParen) s = 'On commence par les parenthèses : ' + eq;
    else if (r.why.md) s = 'Les × et ÷ passent avant les + et − (de gauche à droite) : ' + eq;
    else s = 'Il ne reste que des + et −, de gauche à droite : ' + eq;
    if (r.parenRemoved) s += ' Les parenthèses ont fini leur travail : on les enlève.';
    return s;
  }
  function whyNot(tokens, idx) {
    const gs = groupsOf(tokens);
    const inner = gs.filter((g) => g.inner);
    let s, e;
    if (inner.length) {
      const g = inner.find((g) => idx > g.start && idx < g.end);
      if (!g) return 'paren';
      s = g.start + 1; e = g.end - 1;
    } else { s = 0; e = tokens.length - 1; }
    let hasMD = false;
    for (let i = s; i <= e; i++) if (tokens[i].t === 'o' && MD[tokens[i].v]) hasMD = true;
    if (hasMD && !MD[tokens[idx].v]) return 'md';
    return 'left';
  }
  const WHY_TEXT = {
    paren: 'Regarde les parenthèses ( ) : on calcule toujours ce qui est dedans en premier.',
    md: 'Les multiplications et les divisions passent avant les additions et les soustractions.',
    left: 'Ces opérations ont la même priorité : on commence par celle qui est le plus à gauche.'
  };
  function solveSteps(tokens) {
    const steps = [];
    let cur = tokens.slice();
    let guard = 0;
    while (cur.length > 1 && guard++ < 50) {
      const valid = Array.from(validOps(cur)).sort((x, y) => x - y);
      const idx = valid[0];
      const before = cur;
      const r = applyOp(cur, idx);
      steps.push({ before: before, idx: idx, a: r.a, b: r.b, op: r.op, res: r.res, why: r.why, parenRemoved: r.parenRemoved, after: r.tokens, text: opSentence(r) });
      cur = r.tokens;
    }
    return { steps: steps, final: cur.length === 1 ? cur[0].v : NaN };
  }
  function finalOk(tokens) {
    let cur = tokens.slice(), g = 0;
    while (cur.length > 1 && g++ < 50) {
      const idx = Array.from(validOps(cur)).sort((x, y) => x - y)[0];
      const a = cur[idx - 1].v, b = cur[idx + 1].v, op = cur[idx].v;
      if (!opOk(op, a, b)) return null;
      const res = compute(op, a, b);
      if (res > 150) return null;
      cur = applyOp(cur, idx).tokens;
    }
    return cur[0].v;
  }
  function stripParens(tokens) { return tokens.filter((t) => t.t !== '(' && t.t !== ')'); }
  function naiveLTR(tokens) {
    const s = stripParens(tokens);
    let v = s[0].v;
    for (let i = 1; i < s.length; i += 2) v = compute(s[i].v, v, s[i + 1].v);
    return v;
  }
  function buildTokens(nums, ops, parens) {
    const out = [];
    const opening = parens.slice().sort((x, y) => (y[1] - y[0]) - (x[1] - x[0]));
    const closing = parens.slice().sort((x, y) => (x[1] - x[0]) - (y[1] - y[0]));
    for (let k = 0; k < nums.length; k++) {
      opening.forEach((p) => { if (p[0] === k) out.push({ t: '(' }); });
      out.push({ t: 'n', v: nums[k] });
      closing.forEach((p) => { if (p[1] === k) out.push({ t: ')' }); });
      if (k < ops.length) out.push({ t: 'o', v: ops[k] });
    }
    return out;
  }
  const ALL_OPS = ['+', '−', '×', '÷'];
  function genOps(level) {
    for (let tries = 0; tries < 6000; tries++) {
      let n, ops, parens = [], lo = 2, hi = 12;
      if (level === 1) {
        n = 3; hi = 9;
        const md = pick(['×', '÷']), as = pick(['+', '−']);
        ops = Math.random() < 0.5 ? [as, md] : [md, as];
      } else if (level === 2) {
        n = 4;
        ops = [pick(ALL_OPS), pick(ALL_OPS), pick(ALL_OPS)];
        const nmd = ops.filter((o) => MD[o]).length;
        if (nmd === 0 || nmd === 3) continue;
      } else if (level === 3) {
        n = pick([3, 4]);
        ops = []; for (let i = 0; i < n - 1; i++) ops.push(pick(ALL_OPS));
        const cand = [];
        for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (j - i + 1 < n) cand.push([i, j]);
        parens = [pick(cand)];
      } else {
        n = 5; hi = 9;
        ops = []; for (let i = 0; i < n - 1; i++) ops.push(pick(ALL_OPS));
        parens = pick([[[0, 3], [1, 2]], [[1, 4], [2, 3]], [[0, 1], [2, 3]], [[0, 1], [3, 4]], [[1, 2], [3, 4]]]);
      }
      const nums = []; for (let i = 0; i < n; i++) nums.push(rnd(lo, hi));
      const tokens = buildTokens(nums, ops, parens);
      const f = finalOk(tokens);
      if (f === null || f < 1) continue;
      if (naiveLTR(tokens) === f) continue;
      let allMatter = true;
      for (let pi = 0; pi < parens.length; pi++) {
        const rest = parens.filter((_, k) => k !== pi);
        if (finalOk(buildTokens(nums, ops, rest)) === f) { allMatter = false; break; }
      }
      if (!allMatter) continue;
      return tokens;
    }
    return parseExpr('3 + 4 × 5');
  }

  /* ---------------- Niveaux et exemples ---------------- */
  const LEVELS = [
    { n: 1, name: 'Recrue' },
    { n: 2, name: 'Agent' },
    { n: 3, name: 'Agent spécial' },
    { n: 4, name: 'Maître' }
  ];
  const LEVEL_DESC = {
    mult: ['2 chiffres × 1 chiffre', '3 chiffres × 1 chiffre', '2 chiffres × 2 chiffres', '3 chiffres × 2 chiffres'],
    div: ['2 chiffres ÷ 1 chiffre, sans reste', '3 chiffres ÷ 1 chiffre, sans reste', 'Quotient à 3 chiffres, avec reste', 'Diviseur à 2 chiffres'],
    ops: ['2 opérations', '3 opérations', 'Avec parenthèses', 'Parenthèses multiples']
  };
  const EXAMPLES = {

<script>
/* ===== Interface : Chiffre à chiffre ===== */
(function () {
  'use strict';
  const E = window.Engine;

  const MISSIONS = {
    mult: { num: 1, code: 'Le Coffre', title: 'Multiplication posée', pitch: 'Le coffre ne s’ouvre qu’avec le bon produit. Multiplie chiffre par chiffre, retenues comprises.' },
    div: { num: 2, code: 'Le Partage', title: 'Division posée', pitch: 'Un trésor à partager en parts égales. Trouve le quotient et le reste, étape par étape.' },
    ops: { num: 3, code: 'Le Code', title: 'Priorité des opérations', pitch: 'Le code secret ne marche que si tu calcules dans le bon ordre : parenthèses, puis × et ÷, puis + et −.' }
  };
  const SUPPORTS = {
    full: { word: 'complet', label: 'Complet', desc: 'Le coach explique chaque étape. Idéal pour apprendre la méthode.' },
    partial: { word: 'partiel', label: 'Partiel', desc: 'La case à remplir est surlignée. Le bouton Indice t’aide si tu bloques.' },
    auto: { word: 'auto', label: 'Autonome', desc: 'Tu remplis comme tu veux, puis tu vérifies. Pas d’aide pendant le calcul.' }
  };
  const WORD2SUP = { complet: 'full', partiel: 'partial', auto: 'auto' };
  const PRAISE = ['Bien joué !', 'Excellent travail, agent !', 'Précis comme une horloge !', 'Bravo, c’est réussi !', 'Tu maîtrises la méthode !', 'Superbe calcul !'];
  const COURAGE = ['Tu y es arrivé ! Chaque erreur t’apprend quelque chose.', 'Bravo d’avoir persévéré !'];

  /* ---------- utilitaires ---------- */
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pickOne = (a) => a[Math.floor(Math.random() * a.length)];
  const plural = (n, s, p) => (n > 1 ? p : s);
  const starsFor = (errors) => (errors === 0 ? 3 : errors <= 2 ? 2 : 1);
  const starSvg = (on) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="' + (on ? 'star-on' : 'star-off') + '" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
  const starsHTML = (n) => '<span class="stars" role="img" aria-label="' + n + ' étoile' + (n > 1 ? 's' : '') + ' sur 3">' + [1, 2, 3].map((i) => starSvg(i <= n)).join('') + '</span>';

  const DB = (function () {
    let data = {};
    try { data = JSON.parse(localStorage.getItem('chiffre-a-chiffre') || '{}') || {}; } catch (e) { data = {}; }
    return {
      get: () => data,
      save: () => { try { localStorage.setItem('chiffre-a-chiffre', JSON.stringify(data)); } catch (e) { /* stockage indisponible */ } }
    };
  })();

  /* ---------- état ---------- */
  const S = {
    view: 'home', name: DB.get().name || '', mission: 'mult', level: 1, support: 'full', count: 5,
    pad: false, locked: false, i: 0, results: [], history: [], prob: null, demo: null, timer: null, modal: false
  };

  /* ---------- gabarits communs ---------- */
  function gridHTML(L, o) {
    o = o || {};
    const vals = o.vals || {};
    const lines = {};
    L.lines.forEach((l) => { for (let c = l.c1; c <= l.c2; c++) lines[l.r + ',' + c] = 1; });
    const rowsT = L.rowKinds.map((k) => (k === 'carry' ? 'calc(var(--cs) * .62)' : 'var(--cs)')).join(' ');
    let h = '<div class="grid"' + (o.fixed ? ' data-fixed="' + o.fixed + '"' : '') + ' data-cols="' + L.cols + '" role="img" aria-label="Grille de calcul : ' + esc(L.statement) + '" style="grid-template-columns:repeat(' + L.cols + ',var(--cs));grid-template-rows:' + rowsT + '">';
    for (let r = 0; r < L.rows; r++) {
      for (let c = 0; c < L.cols; c++) {
        const key = r + ',' + c;
        const cell = L.cells[key];
        let cls = 'cell', txt = '', attr = '';
        if (L.rowKinds[r] === 'carry') cls += ' cr';
        if (cell && cell.kind === 'static') { cls += ' st'; txt = cell.text; }
        else if (cell) {
          cls += ' in';
          const v = vals[key];
          txt = v === undefined ? '' : v;
          if (v === undefined) cls += ' empty';
          if (o.inputKey === key) txt = '<input class="cellin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Ton chiffre" value="' + (v === undefined ? '' : v) + '">';
          if (o.clickable) { cls += ' click'; attr = ' data-act="cell" data-k="' + key + '"'; }
        } else if (L.rowKinds[r] === 'carry' && c === 0) { cls += ' lbl'; txt = 'ret.'; }
        if (lines[key]) cls += ' lb';
        if (L.bar && c === L.bar.col && r >= L.bar.fromRow) cls += ' bl';
        if (o.cur === key) cls += ' cur';
        if (o.sel === key) cls += ' sel';
        if (o.newSet && o.newSet.has(key)) cls += ' new';
        if (o.pop === key) cls += ' pop';
        if ((o.bad && o.bad.has(key)) || o.badKey === key) cls += ' bad';
        h += '<div class="' + cls + '"' + attr + '>' + txt + '</div>';
      }
    }
    // flèches « on abaisse le chiffre » (division)
    (L.downs || []).forEach((d) => {
      const filled = vals[d.key] !== undefined, now = o.cur === d.key || (o.newSet && o.newSet.has(d.key));
      if (!filled && !now) return;
      h += '<span class="dn' + (now ? ' now' : '') + '" style="left:calc(var(--cs) * ' + (d.c + 0.5) + ' - 1.5px);top:calc(var(--cs) * 2 - 6px);height:calc(var(--cs) * ' + (d.toR - 2) + ' + 12px)" aria-hidden="true"></span>';
    });
    return h + '</div>';
  }

  function tokensHTML(tokens, o) {
    o = o || {};
    return tokens.map((t, i) => {
      let cls = 'tk';
      if (o.used !== undefined && i >= o.used - 1 && i <= o.used + 1) cls += ' used';
      if (o.pend !== undefined && o.pend !== null && i >= o.pend - 1 && i <= o.pend + 1) cls += ' pend';
      if (t.t === 'n') return '<span class="' + cls + '">' + t.v + '</span>';
      if (t.t === 'o') {
        if (o.click) return '<button type="button" class="opb' + (o.badIdx === i ? ' bad' : '') + '" data-act="op" data-i="' + i + '" title="Faire cette opération en premier">' + t.v + '</button>';
        return '<span class="' + cls + '">' + t.v + '</span>';
      }
      return '<span class="tk p">' + t.t + '</span>';
    }).join('');
  }
  function exprListHTML(list) {
    return '<div class="exprs">' + list.map((e, i) =>
      '<div class="ex-line' + (i < list.length - 1 ? ' past' : '') + '">' + (i > 0 ? '<span class="eq">=</span>' : '') + tokensHTML(e.tokens, e) + '</div>'
    ).join('') + '</div>';
  }
  const LEGEND = '<div class="legend"><b>Ordre des priorités</b><ol><li>Les parenthèses ( )</li><li>Les × et ÷, de gauche à droite</li><li>Les + et −, de gauche à droite</li></ol></div>';

  /* ---------- en-tête ---------- */
  const MARK = '<svg class="brand-mark" viewBox="0 0 38 38" aria-hidden="true"><rect x="2" y="2" width="34" height="34" rx="8" fill="#fff"/><path d="M13.5 2v34M24.5 2v34M2 13.5h34M2 24.5h34" stroke="#C6DAEA" stroke-width="1.5"/><rect x="14.5" y="14.5" width="9" height="9" fill="#FFD23F"/><rect x="2" y="2" width="34" height="34" rx="8" fill="none" stroke="#12203A" stroke-width="2.5"/></svg>';
  function topHTML() {
    return '<header class="wrap top"><button class="brand" data-act="home" aria-label="Retour à l’accueil">' + MARK + '<span class="brand-name"><span>Chiffre</span> à chiffre</span></button>' +
      (S.name ? '<div class="agent-chip">Agent <b>' + esc(S.name) + '</b></div>' : '') + '</header>';
  }

  /* ---------- accueil ---------- */
  function ratioStars(r) { return r >= 0.9 ? 3 : r >= 0.6 ? 2 : r > 0 ? 1 : 0; }
  function homeView() {
    const best = DB.get().best || {};
    const L = E.buildMult(47, 6);
    const vals = {};
    L.steps.forEach((s, i) => { if (i < L.steps.length - 2) vals[s.r + ',' + s.c] = s.expected; });
    const cs = L.steps[L.steps.length - 2];
    const cards = ['mult', 'div', 'ops'].map((m) => {
      const M = MISSIONS[m];
      const lv = E.LEVELS.map((l) => {
        const st = ratioStars(best[m + '-' + l.n] || 0);
        return '<button class="lvl" data-act="pick" data-m="' + m + '" data-n="' + l.n + '"><span class="lvl-n">' + l.n + '</span><span class="lvl-t"><b>' + l.name + '</b><small>' + E.LEVEL_DESC[m][l.n - 1] + '</small></span>' + starsHTML(st) + '</button>';
      }).join('');
      return '<article class="mcard" data-m="' + m + '"><div class="mcard-top"><span>Mission ' + M.num + '</span></div><div class="mcard-body"><h2>' + M.code + '</h2><p class="sub">' + M.title + '</p><p class="pitch">' + M.pitch + '</p><div class="levels">' + lv + '</div></div></article>';
    }).join('');
    return '<section class="hero"><div><h1>Pose-le, <em>chiffre à chiffre</em>.</h1>' +
      '<p class="lead">Trois missions de calcul sur papier quadrillé. Chaque mission commence par un exemple animé, puis c’est à toi de jouer.</p>' +
      '<div class="name-row"><label for="nm">Ton prénom d’agent</label><input id="nm" type="text" maxlength="24" autocomplete="off" placeholder="Ex. Léa" value="' + esc(S.name) + '"></div></div>' +
      '<div class="hero-sheet">' + gridHTML(L, { vals: vals, cur: cs.r + ',' + cs.c, fixed: 40 }) + '<p class="hero-cap">47 × 6 : la case jaune, c’est à toi.</p></div></section>' +
      '<section class="missions" aria-label="Missions">' + cards + '</section>' +
      '<footer class="foot"><span>Inspiré de Digit Drills. Tes étoiles restent dans ton navigateur.</span><button class="btn btn-ghost btn-small" data-act="teacher">Espace enseignant</button></footer>';
  }

  /* ---------- préparation ---------- */
  function setupView() {
    const M = MISSIONS[S.mission];
    const lv = E.LEVELS.map((l) => '<button class="seg-btn" data-act="setLevel" data-v="' + l.n + '" aria-pressed="' + (S.level === l.n) + '"><b>' + l.n + ' · ' + l.name + '</b><small>' + E.LEVEL_DESC[S.mission][l.n - 1] + '</small></button>').join('');
    const sp = Object.keys(SUPPORTS).map((k) => '<button class="seg-btn" data-act="setSupport" data-v="' + k + '" aria-pressed="' + (S.support === k) + '"><b>' + SUPPORTS[k].label + '</b><small>' + SUPPORTS[k].desc + '</small></button>').join('');
    const ct = [3, 5, 8].map((n) => '<button class="seg-btn" data-act="setCount" data-v="' + n + '" aria-pressed="' + (S.count === n) + '">' + n + '</button>').join('');
    return '<div class="crumbs"><button class="btn btn-ghost btn-small" data-act="home">← Toutes les missions</button></div>' +
      '<section class="panel stage" data-m="' + S.mission + '"><span class="tag">Mission ' + M.num + '</span><h1>' + M.code + ' · ' + M.title + '</h1><p class="lead">' + M.pitch + '</p>' +
      '<div class="field"><h3>Niveau</h3><div class="seg">' + lv + '</div></div>' +
      '<div class="field"><h3>Soutien</h3><div class="seg">' + sp + '</div></div>' +
      '<div class="field"><h3>Nombre de problèmes</h3><div class="seg counts">' + ct + '</div></div>' +
      '<div class="go"><button class="btn btn-primary" data-act="toExample">Voir l’exemple →</button><span class="note">Tu verras d’abord un exemple, puis ' + S.count + ' problèmes.</span></div></section>';
  }

  /* ---------- exemple animé ---------- */
  function exampleView() {
    const D = S.demo, ex = D.ex, M = MISSIONS[S.mission], lv = E.LEVELS[S.level - 1];
    let sheet, narr;
    if (ex.kind === 'grid') {
      const L = ex.layout, vals = {}, nw = new Set();
      for (let g = 0; g < D.k; g++) L.groups[g].steps.forEach((si) => { const s = L.steps[si]; const key = s.r + ',' + s.c; vals[key] = s.expected; if (g === D.k - 1) nw.add(key); });
      sheet = '<div class="sheet-stmt"><small>Exemple</small>' + esc(L.statement) + '</div>' + gridHTML(L, { vals: vals, newSet: nw });
      if (D.k === 0) narr = 'Voici l’exemple : <b>' + esc(L.statement) + '</b>. Appuie sur « Étape suivante » pour voir la méthode, un chiffre à la fois.';
      else { const g = L.groups[D.k - 1]; narr = (g.intro ? g.intro + ' ' : '') + g.text; }
      if (D.k === D.n) narr += ' <b>Réponse : ' + esc(L.answerText) + '.</b>';
    } else {
      const steps = ex.solution.steps, list = [];
      for (let j = 0; j < D.k; j++) list.push({ tokens: steps[j].before, used: steps[j].idx });
      list.push({ tokens: D.k === 0 ? ex.tokens : steps[D.k - 1].after });
      sheet = '<div class="sheet-stmt"><small>Exemple</small>' + esc(E.exprToString(ex.tokens)) + '</div>' + exprListHTML(list) + LEGEND;
      if (D.k === 0) narr = 'Voici l’exemple. Avant de calculer, on cherche <b>quelle opération passe en premier</b>. Appuie sur « Étape suivante ».';
      else narr = steps[D.k - 1].text;
      if (D.k === D.n) narr += ' <b>Réponse : ' + ex.solution.final + '.</b>';
    }
    const end = D.k >= D.n;
    const pct = Math.round(100 * D.k / D.n);
    return '<div class="crumbs"><button class="btn btn-ghost btn-small" data-act="' + (S.locked ? 'home' : 'backSetup') + '">← ' + (S.locked ? 'Accueil' : 'Changer les réglages') + '</button></div>' +
      '<section class="stage" data-m="' + S.mission + '"><div class="stage-head"><div class="stage-title"><span class="tag">Briefing · Mission ' + M.num + '</span><h1>' + M.code + ' : regarde l’exemple</h1></div></div>' +
      (S.locked ? '<p class="locked-note"><span>Niveau ' + S.level + ' · ' + lv.name + '</span><span>Soutien ' + SUPPORTS[S.support].label.toLowerCase() + '</span><span>' + S.count + ' problèmes</span></p>' : '') +
      '<div class="work"><div class="sheet">' + sheet + '</div><div class="side">' +
      '<div class="coach" aria-live="polite"><span class="coach-tag">Briefing</span><p class="ask">' + narr + '</p><div class="progress-bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div><span class="steps-count">Étape ' + D.k + ' sur ' + D.n + '</span></div>' +
      '<div class="demo-ctl"><button class="btn btn-primary" data-act="demoNext">' + (end ? 'J’ai compris : commencer la mission →' : 'Étape suivante ▶') + '</button>' +
      '<div class="row"><button class="btn btn-small" data-act="demoPrev"' + (D.k === 0 ? ' disabled' : '') + '>◀ Précédent</button>' +
      '<button class="btn btn-small" data-act="demoAll"' + (end ? ' disabled' : '') + '>Tout voir</button>' +
      '<button class="btn btn-small" data-act="demoAuto"' + (end ? ' disabled' : '') + '>' + (S.timer ? '⏸ Pause' : '▶ Lecture auto') + '</button></div>' +
      (end ? '<button class="btn btn-ghost btn-small" data-act="demoReset">↻ Revoir l’exemple</button>' : '<button class="btn btn-ghost btn-small" data-act="skipDemo">Passer l’exemple</button>') +
      '</div></div></div></section>';
  }

  /* ---------- pratique ---------- */
  function padHTML(kind) {
    const act = kind === 'hint' ? '<button class="btn btn-primary btn-small" data-act="hint">Indice</button>'
      : kind === 'check' ? '<button class="btn btn-primary btn-small" data-act="enter">Vérifier</button>'
      : kind === 'ok' ? '<button class="btn btn-primary btn-small" data-act="enter">OK</button>' : '';
    let keys = '';
    if (S.pad) {
      keys = '<div class="pad" role="group" aria-label="Pavé numérique">' + [7, 8, 9, 4, 5, 6, 1, 2, 3].map((d) => '<button class="key" data-act="digit" data-d="' + d + '">' + d + '</button>').join('') +
        '<button class="key fn" data-act="back" aria-label="Effacer">Effacer</button><button class="key" data-act="digit" data-d="0">0</button><span></span></div>';
    }
    return '<div class="pad-wrap"><p class="typehint">Tape ta réponse au clavier. Entrée = valider, Retour arrière = effacer.</p>' + keys +
      '<div class="actrow">' + act + '<button class="btn btn-ghost btn-small" data-act="togglePad">' + (S.pad ? 'Masquer le pavé' : 'Pavé à l’écran') + '</button></div></div>';
  }
  function resultHTML(P) {
    const stars = starsFor(P.errors);
    const last = S.i >= S.count - 1;
    const msg = stars === 3 ? pickOne(PRAISE) : pickOne(stars === 2 ? PRAISE : COURAGE);
    const ans = P.kind === 'grid' ? P.L.statement + ' = ' + P.L.answerText : P.statement + ' = ' + P.final;
    return '<div class="result-card">' + starsHTML(stars) + '<div class="big">' + msg + '</div><p>' + esc(ans) + '</p><button class="btn btn-primary" data-act="next">' + (last ? 'Voir le bilan' : 'Problème suivant') + ' →</button></div>';
  }

  function gridCoach(P) {
    const sup = S.support;
    const st = P.L.steps[P.si];
    let ask;
    if (P.done) ask = 'Réponse : <b>' + esc(P.L.answerText) + '</b>';
    else if (sup === 'full') ask = esc(st.ask) + (P.stepErr >= 2 ? ' <span class="fb no">Indice : ' + esc(st.hint) + '</span>' : '');
    else if (sup === 'partial') ask = P.hint ? esc(st.ask) : 'Écris le chiffre qui va dans la case jaune.';
    else ask = 'Remplis les cases comme tu veux (touche une case pour la choisir), puis appuie sur « Vérifier ».';
    return '<div class="coach" aria-live="polite"><span class="coach-tag">' + (sup === 'auto' ? 'Consigne' : 'Coach') + '</span>' +
      (P.fb ? '<p class="fb ok">✓ ' + esc(P.fb) + '</p>' : '') + (P.err ? '<p class="fb no">' + esc(P.err) + '</p>' : '') + '<p class="ask">' + ask + '</p></div>';
  }
  function opsCoach(P) {
    const sup = S.support;
    let ask;
    if (P.done) ask = 'Réponse : <b>' + P.final + '</b>';
    else if (P.phase === 'pick') {
      ask = sup === 'full' ? 'Quelle opération faut-il faire en premier ? Touche-la dans l’expression. Cherche d’abord les parenthèses, puis les × et ÷, puis les + et −.' : 'Touche l’opération à faire en premier.';
      if (sup === 'partial' && P.hint) ask = 'Regarde le rappel des priorités : parenthèses, puis × et ÷, puis + et −. Quand deux opérations ont la même priorité, commence par la plus à gauche.';
    } else {
      const a = P.tokens[P.pend - 1].v, b = P.tokens[P.pend + 1].v, op = P.tokens[P.pend].v;
      ask = 'Calcule <b>' + a + ' ' + op + ' ' + b + '</b>, écris le résultat, puis appuie sur OK.';
      if (sup === 'full' && P.stepErr >= 2) ask += ' <span class="fb no">Indice : ' + a + ' ' + op + ' ' + b + ' = ' + E.applyOp(P.tokens, P.pend).res + '</span>';
    }
    return '<div class="coach" aria-live="polite"><span class="coach-tag">' + (sup === 'auto' ? 'Consigne' : 'Coach') + '</span>' +
      (P.fb ? '<p class="fb ok">✓ ' + esc(P.fb) + '</p>' : '') + (P.err ? '<p class="fb no">' + esc(P.err) + '</p>' : '') + '<p class="ask">' + ask + '</p></div>';
  }

  function practiceView() {
    const P = S.prob, M = MISSIONS[S.mission], lv = E.LEVELS[S.level - 1];
    const dots = Array.from({ length: S.count }, (_, i) => '<span class="dot' + (i === S.i && !P.done ? ' now' : '') + (S.results[i] ? ' s' + S.results[i] : '') + '"></span>').join('');
    let sheet, coach, pad;
    if (P.kind === 'grid') {
      const st = P.L.steps[P.si];
      const auto = S.support === 'auto';
      sheet = '<div class="sheet-stmt"><small>Problème ' + (S.i + 1) + ' sur ' + S.count + '</small>' + esc(P.L.statement) + '</div>' +
        gridHTML(P.L, { inputKey: !P.done ? (auto ? P.sel : (st ? st.r + ',' + st.c : null)) : null, vals: P.vals, cur: !auto && !P.done && st ? st.r + ',' + st.c : null, sel: auto && !P.done ? P.sel : null, clickable: auto && !P.done, bad: P.bad, badKey: P.badKey, pop: P.pop });
      coach = gridCoach(P);
      pad = P.done ? resultHTML(P) : padHTML(auto ? 'check' : S.support === 'partial' ? 'hint' : 'none');
    } else {
      const list = P.hist.map((h) => ({ tokens: h.tokens, used: h.idx }));
      const live = { tokens: P.tokens };
      if (!P.done && P.phase === 'pick') { live.click = true; live.badIdx = P.badIdx; }
      if (!P.done && P.phase === 'answer') live.pend = P.pend;
      list.push(live);
      let extra = '';
      if (!P.done && P.phase === 'answer') {
        const a = P.tokens[P.pend - 1].v, b = P.tokens[P.pend + 1].v, op = P.tokens[P.pend].v;
        extra = '<div class="exprs"><div class="ans-line"><span>' + a + ' ' + op + ' ' + b + ' =</span><input class="ans-box ansin' + (P.badAns ? ' bad' : '') + '" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Ta réponse" placeholder="?" value="' + P.buf + '"></div></div>';
      }
      if (P.done) extra = '<div class="exprs"><div class="final-box">' + starsHTML(starsFor(P.errors)) + ' Réponse : ' + P.final + '</div></div>';
      sheet = '<div class="sheet-stmt"><small>Problème ' + (S.i + 1) + ' sur ' + S.count + '</small>' + esc(P.statement) + '</div>' + exprListHTML(list) + extra + (S.support !== 'auto' ? LEGEND : '');
      coach = opsCoach(P);
      pad = P.done ? resultHTML(P) : padHTML(P.phase === 'answer' ? 'ok' : S.support === 'partial' ? 'hint' : 'none');
    }
    return '<div class="crumbs"><button class="btn btn-ghost btn-small" data-act="home">← Quitter la mission</button></div>' +
      '<section class="stage" data-m="' + S.mission + '"><div class="stage-head"><div class="stage-title"><span class="tag">Mission ' + M.num + '</span><h1>' + M.code + ' · niveau ' + S.level + ' ' + lv.name + '</h1></div><div class="dots" role="img" aria-label="Problème ' + (S.i + 1) + ' sur ' + S.count + '">' + dots + '</div></div>' +
      '<div class="work"><div class="sheet">' + sheet + '</div><div class="side">' + coach + pad + '</div></div></section>';
  }

  /* ---------- bilan ---------- */
  function doneView() {
    const M = MISSIONS[S.mission];
    const total = S.results.reduce((a, b) => a + b, 0), max = 3 * S.count, ratio = total / max;
    const stamp = ratio >= 0.8 ? ['Mission accomplie', ''] : ratio >= 0.5 ? ['Bon travail, agent', 'mid'] : ['Continue l’entraînement', 'low'];
    const rows = S.history.map((h) => '<div class="recap-row"><span>' + esc(h.text) + '</span>' + starsHTML(h.stars) + '</div>').join('');
    const hello = S.name ? esc(S.name) + ', ' : '';
    return '<section class="stage done" data-m="' + S.mission + '"><span class="tag">Mission ' + M.num + ' · ' + M.code + ' · niveau ' + S.level + '</span>' +
      '<div class="stamp ' + stamp[1] + '">' + stamp[0] + '</div>' +
      '<p class="total">' + hello + total + ' / ' + max + ' étoiles</p>' +
      '<div class="recap">' + rows + '</div>' +
      '<div class="go"><button class="btn btn-primary" data-act="replay">Rejouer ce niveau</button>' +
      (S.level < 4 ? '<button class="btn" data-act="levelUp">Niveau suivant →</button>' : '') +
      '<button class="btn btn-ghost" data-act="home">Toutes les missions</button></div></section>';
  }

  /* ---------- fenêtre enseignant ---------- */
  function modalHTML() {
    const mo = ['mult', 'div', 'ops'].map((m) => '<option value="' + m + '"' + (m === S.mission ? ' selected' : '') + '>Mission ' + MISSIONS[m].num + ' · ' + MISSIONS[m].title + '</option>').join('');
    const lo = E.LEVELS.map((l) => '<option value="' + l.n + '">Niveau ' + l.n + ' · ' + l.name + '</option>').join('');
    const so = Object.keys(SUPPORTS).map((k) => '<option value="' + k + '">' + SUPPORTS[k].label + '</option>').join('');
    const co = [3, 5, 8, 10].map((n) => '<option value="' + n + '"' + (n === 5 ? ' selected' : '') + '>' + n + ' problèmes</option>').join('');
    return '<div class="modal-back" id="modal" data-act="closeModalBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Espace enseignant</h2>' +
      '<p class="note">Choisis les réglages, puis partage le lien. L’élève arrive directement sur l’exemple de la mission.</p>' +
      '<label>Mission<select id="t-m">' + mo + '</select></label>' +
      '<div class="two"><label>Niveau<select id="t-n">' + lo + '</select></label><label>Soutien<select id="t-s">' + so + '</select></label></div>' +
      '<label>Nombre de problèmes<select id="t-q">' + co + '</select></label>' +
      '<div class="linkbox"><label for="t-link">Lien à partager</label><input id="t-link" type="text" readonly value=""><div class="go" style="margin-top:0"><button class="btn btn-primary btn-small" data-act="copyLink">Copier le lien</button><button class="btn btn-small" data-act="tryLink">Essayer l’activité</button><button class="btn btn-ghost btn-small" data-act="closeModal">Fermer</button></div><p class="note" id="t-msg" aria-live="polite"></p></div></div></div>';
  }
  function teacherLink() {
    const g = (id) => document.getElementById(id).value;
    const base = location.href.split('#')[0];
    return base + '#' + g('t-m') + '-' + g('t-n') + '-' + SUPPORTS[g('t-s')].word + '-' + g('t-q');
  }
  function refreshLink() { const el = document.getElementById('t-link'); if (el) el.value = teacherLink(); }

  /* ---------- rendu ---------- */
  function fitGrids() {
    document.querySelectorAll('.grid').forEach((g) => {
      if (g.dataset.fixed) { g.style.setProperty('--cs', g.dataset.fixed + 'px'); return; }
      const cols = +g.dataset.cols, sheet = g.closest('.sheet');
      const avail = (sheet ? sheet.clientWidth : 600) - 34;
      g.style.setProperty('--cs', Math.max(30, Math.min(52, Math.floor(avail / cols))) + 'px');
    });
  }
  function render() {
    let body = '';
    if (S.view === 'home') body = homeView();
    else if (S.view === 'setup') body = setupView();
    else if (S.view === 'example') body = exampleView();
    else if (S.view === 'practice') body = practiceView();
    else if (S.view === 'done') body = doneView();
    document.getElementById('app').innerHTML = topHTML() + '<main class="wrap">' + body + '</main>' + (S.modal ? modalHTML() : '');
    fitGrids();
    focusInput();
    if (S.view === 'practice') requestAnimationFrame(keepInView);
    if (S.modal) refreshLink();
    if (S.prob) { S.prob.pop = null; S.prob.badKey = null; S.prob.badIdx = null; S.prob.badAns = false; }
  }
  // Sur téléphone, le pavé numérique reste collé en bas : on garde la case active et la consigne visibles au-dessus.
  function keepInView() {
    if (window.innerWidth > 880 || S.view !== 'practice') return;
    const pad = document.querySelector('.pad-wrap');
    if (!pad) { const rc = document.querySelector('.result-card'); if (rc) rc.scrollIntoView({ block: 'nearest' }); return; }
    const limit = pad.getBoundingClientRect().top - 8;
    const cell = document.querySelector('.cell.cur, .cell.sel, .ans-line, .opb');
    const coach = document.querySelector('.coach');
    if (!cell) return;
    const c = cell.getBoundingClientRect(), k = coach ? coach.getBoundingClientRect() : c;
    let dy = k.bottom > limit ? k.bottom - limit : 0;
    if (c.top - dy < 60) dy = c.top - 60;
    if (c.bottom - dy > limit) dy = c.bottom - limit;
    if (Math.abs(dy) > 1) window.scrollBy(0, dy);
  }
  function focusInput() {
    const el = document.querySelector('.cellin, .ansin');
    if (el) { try { el.focus({ preventScroll: true }); el.select(); } catch (e) { /* ignoré */ } }
  }
  function go(view) { stopAuto(); S.view = view; S.modal = false; render(); window.scrollTo(0, 0); }

  /* ---------- exemple : actions ---------- */
  function stopAuto() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  function openExample() {
    stopAuto();
    const ex = E.makeExample(S.mission, S.level);
    S.demo = { ex: ex, k: 0, n: ex.kind === 'grid' ? ex.layout.groups.length : ex.solution.steps.length };
    go('example');
  }
  function demoNext() {
    const D = S.demo;
    if (D.k >= D.n) { startPractice(); return; }
    D.k++;
    if (D.k >= D.n) stopAuto();
    render();
  }
  function demoAuto() {
    if (S.timer) { stopAuto(); render(); return; }
    S.timer = setInterval(() => { if (S.demo.k < S.demo.n) { S.demo.k++; if (S.demo.k >= S.demo.n) stopAuto(); render(); } else stopAuto(); }, 2300);
    if (S.demo.k < S.demo.n) { S.demo.k++; }
    render();
  }

  /* ---------- pratique : actions ---------- */
  function startPractice() { S.results = []; S.history = []; S.i = 0; startProblem(); }
  function startProblem() {
    stopAuto();
    const p = E.makeProblem(S.mission, S.level);
    if (p.kind === 'grid') {
      S.prob = { kind: 'grid', L: p.layout, vals: {}, si: 0, errors: 0, stepErr: 0, fb: '', err: '', hint: false, done: false, sel: null, bad: new Set(), pop: null, badKey: null };
      if (S.support === 'auto') { const s0 = p.layout.steps[0]; S.prob.sel = s0.r + ',' + s0.c; }
    } else {
      S.prob = { kind: 'ops', tokens: p.tokens, hist: [], phase: 'pick', pend: null, buf: '', errors: 0, stepErr: 0, fb: '', err: '', hint: false, done: false, statement: E.exprToString(p.tokens), final: p.solution.final, badIdx: null, badAns: false };
    }
    go('practice');
  }
  function finishProblem() {
    const P = S.prob;
    P.done = true; P.err = '';
    const stars = starsFor(P.errors);
    S.results[S.i] = stars;
    S.history[S.i] = { text: P.kind === 'grid' ? P.L.statement + ' = ' + P.L.answerText : P.statement + ' = ' + P.final, stars: stars };
    render();
  }
  function nextProblem() {
    S.i++;
    if (S.i >= S.count) {
      const total = S.results.reduce((a, b) => a + b, 0), ratio = total / (3 * S.count);
      const d = DB.get(); d.best = d.best || {};
      const key = S.mission + '-' + S.level;
      if (!d.best[key] || ratio > d.best[key]) d.best[key] = ratio;
      DB.save();
      go('done');
    } else startProblem();
  }
  function keyOfStep(s) { return s.r + ',' + s.c; }
  function nextEmptyAfter(P, key) {
    const keys = P.L.steps.map(keyOfStep);
    const at = keys.indexOf(key);
    for (let d = 1; d <= keys.length; d++) { const k = keys[(at + d) % keys.length]; if (P.vals[k] === undefined) return k; }
    return key;
  }
  const BAD_GRID_FULL = ['Pas tout à fait. Relis la consigne et réessaie.', 'Presque ! Refais le calcul calmement.'];

  function onDigit(d) {
    const P = S.prob;
    if (S.view !== 'practice' || !P || P.done) return;
    if (P.kind === 'grid') {
      if (S.support === 'auto') {
        if (!P.sel) return;
        P.vals[P.sel] = d; P.bad.delete(P.sel); P.err = ''; P.pop = P.sel; P.sel = nextEmptyAfter(P, P.sel);
        render(); return;
      }
      const st = P.L.steps[P.si], key = keyOfStep(st);
      if (d === st.expected) {
        P.vals[key] = d; P.pop = key; P.stepErr = 0; P.err = ''; P.hint = false;
        const g = P.L.groups[st.gid];
        if (g.steps[g.steps.length - 1] === P.si) P.fb = g.text;
        P.si++;
        if (P.si >= P.L.steps.length) { finishProblem(); return; }
      } else {
        P.errors++; P.stepErr++; P.badKey = key;
        P.err = S.support === 'full' ? pickOne(BAD_GRID_FULL) : 'Pas tout à fait. Essaie encore ou demande un indice.';
      }
      render();
    } else if (P.phase === 'answer') {
      if (P.buf.length < 4) P.buf += d;
      P.err = ''; render();
    }
  }
  function onBack() {
    const P = S.prob;
    if (S.view !== 'practice' || !P || P.done) return;
    if (P.kind === 'grid' && S.support === 'auto' && P.sel) { delete P.vals[P.sel]; P.bad.delete(P.sel); render(); }
    else if (P.kind === 'ops' && P.phase === 'answer') { P.buf = P.buf.slice(0, -1); render(); }
  }
  function onEnter() {
    const P = S.prob;
    if (S.view !== 'practice' || !P) return;
    if (P.done) { nextProblem(); return; }
    if (P.kind === 'grid' && S.support === 'auto') checkAuto();
    else if (P.kind === 'ops' && P.phase === 'answer') submitAnswer();
  }
  function checkAuto() {
    const P = S.prob, empty = [], wrong = [];
    P.L.steps.forEach((s) => { const k = keyOfStep(s); if (P.vals[k] === undefined) empty.push(k); else if (P.vals[k] !== s.expected) wrong.push(k); });
    P.bad = new Set(wrong); P.fb = '';
    if (wrong.length) {
      P.errors++;
      P.err = wrong.length + ' case' + plural(wrong.length, ' est', 's sont') + ' à revoir (en rouge). Corrige, puis vérifie à nouveau.' + (empty.length ? ' Il reste aussi ' + empty.length + ' case' + plural(empty.length, '', 's') + ' vide' + plural(empty.length, '', 's') + '.' : '');
    } else if (empty.length) {
      P.err = 'Tout ce que tu as écrit est juste. Il reste ' + empty.length + ' case' + plural(empty.length, '', 's') + ' vide' + plural(empty.length, '', 's') + '.';
      if (!P.sel || P.vals[P.sel] !== undefined) P.sel = empty[0];
    } else { finishProblem(); return; }
    render();
  }
  function onCell(k) {
    const P = S.prob;
    if (S.view !== 'practice' || !P || P.done || S.support !== 'auto' || P.sel === k) return;
    P.sel = k; render();
  }
  function onHint() {
    const P = S.prob;
    if (S.view !== 'practice' || !P || P.done) return;
    P.hint = true; render();
  }
  function onOp(i) {
    const P = S.prob;
    if (S.view !== 'practice' || !P || P.done || P.phase !== 'pick') return;
    if (E.validOps(P.tokens).has(i)) { P.phase = 'answer'; P.pend = i; P.buf = ''; P.err = ''; P.stepErr = 0; P.hint = false; render(); return; }
    P.errors++; P.badIdx = i;
    const why = E.whyNot(P.tokens, i);
    P.err = S.support === 'full' ? E.WHY_TEXT[why] : S.support === 'partial' ? 'Ce n’est pas l’opération à faire en premier. Regarde le rappel des priorités.' : 'Ce n’est pas l’opération à faire en premier.';
    render();
  }
  function submitAnswer() {
    const P = S.prob;
    if (!P.buf) { P.err = 'Écris ta réponse avec le pavé, puis appuie sur OK.'; render(); return; }
    const r = E.applyOp(P.tokens, P.pend);
    if (parseInt(P.buf, 10) === r.res) {
      P.hist.push({ tokens: P.tokens, idx: P.pend });
      P.tokens = r.tokens; P.fb = E.opSentence(r); P.err = ''; P.phase = 'pick'; P.pend = null; P.buf = ''; P.stepErr = 0; P.hint = false;
      if (P.tokens.length === 1) { finishProblem(); return; }
    } else {
      P.errors++; P.stepErr++; P.badAns = true; P.buf = '';
      P.err = 'Pas tout à fait. Refais le calcul ' + r.a + ' ' + r.op + ' ' + r.b + '.';
    }
    render();
  }

  /* ---------- activité depuis un lien ---------- */
  function route() {
    const m = /^(mult|div|ops)-([1-4])-(complet|partiel|auto)-(\d{1,2})$/.exec(location.hash.slice(1));
    if (!m) return false;
    S.mission = m[1]; S.level = +m[2]; S.support = WORD2SUP[m[3]]; S.count = Math.max(1, Math.min(12, +m[4])); S.locked = true;
    openExample();
    return true;
  }
  function clearHash() { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignoré */ } }

  /* ---------- événements ---------- */
  const ACTIONS = {
    home: () => { S.locked = false; clearHash(); go('home'); },
    pick: (d) => { S.mission = d.m; S.level = +d.n; S.locked = false; go('setup'); },
    setLevel: (d) => { S.level = +d.v; render(); },
    setSupport: (d) => { S.support = d.v; render(); },
    setCount: (d) => { S.count = +d.v; render(); },
    toExample: () => openExample(),
    backSetup: () => go('setup'),
    demoNext: () => demoNext(),
    demoPrev: () => { if (S.demo.k > 0) { S.demo.k--; stopAuto(); render(); } },
    demoAll: () => { stopAuto(); S.demo.k = S.demo.n; render(); },
    demoAuto: () => demoAuto(),
    demoReset: () => { stopAuto(); S.demo.k = 0; render(); },
    skipDemo: () => startPractice(),
    digit: (d) => onDigit(+d.d),
    back: () => onBack(),
    enter: () => onEnter(),
    hint: () => onHint(),
    togglePad: () => { S.pad = !S.pad; render(); },
    cell: (d) => onCell(d.k),
    op: (d) => onOp(+d.i),
    next: () => nextProblem(),
    replay: () => openExample(),
    levelUp: () => { S.level = Math.min(4, S.level + 1); openExample(); },
    teacher: () => { S.modal = true; render(); },
    closeModal: () => { S.modal = false; render(); },
    tryLink: () => {
      const g = (id) => document.getElementById(id).value;
      S.mission = g('t-m'); S.level = +g('t-n'); S.support = g('t-s'); S.count = +g('t-q'); S.locked = true;
      openExample();
    },
    copyLink: () => {
      const el = document.getElementById('t-link'), msg = document.getElementById('t-msg');
      const done = () => { msg.textContent = 'Lien copié. Colle-le dans ton courriel, ton ENA ou ton site de classe.'; };
      const fallback = () => { el.focus(); el.select(); msg.textContent = 'Sélectionné : fais Ctrl + C (ou ⌘ + C) pour le copier.'; };
      try { navigator.clipboard.writeText(el.value).then(done, fallback); } catch (e) { fallback(); }
    }
  };
  document.addEventListener('click', (e) => {
    if (e.target.id === 'modal') { S.modal = false; render(); return; }
    const t = e.target.closest('[data-act]');
    if (!t || t.dataset.act === 'closeModalBack') return;
    const fn = ACTIONS[t.dataset.act];
    if (fn) fn(t.dataset);
  });
  document.addEventListener('change', (e) => { if (e.target.closest && e.target.closest('#modal')) refreshLink(); });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.classList && t.classList.contains('cellin')) {
      const m = /\d/.exec(t.value.slice(-1));
      if (m) onDigit(+m[0]); else t.value = '';
      return;
    }
    if (t.classList && t.classList.contains('ansin')) { if (S.prob) S.prob.buf = t.value.replace(/\D/g, '').slice(0, 4); return; }
    if (e.target.id === 'nm') { S.name = e.target.value.slice(0, 24); DB.get().name = S.name; DB.save(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const mine = e.target.classList && (e.target.classList.contains('cellin') || e.target.classList.contains('ansin'));
    if (!mine && e.target.closest && e.target.closest('input,select,textarea')) return;
    if (e.key === 'Escape' && S.modal) { S.modal = false; render(); return; }
    if (S.view === 'example') { if (e.key === 'ArrowRight') { demoNext(); e.preventDefault(); } else if (e.key === 'ArrowLeft') { ACTIONS.demoPrev(); e.preventDefault(); } return; }
    if (S.view !== 'practice') return;
    if (/^[0-9]$/.test(e.key)) { onDigit(+e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { onBack(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (e.target.closest && e.target.closest('button')) return; onEnter(); e.preventDefault(); }
  });
  let rz;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fitGrids, 120); });
  window.addEventListener('hashchange', () => { if (location.hash.length > 1) route(); });

  window.__cac = { state: () => S };
  if (!route()) render();
})();

</script>
</body>
</html>
